# Manual skeleton. It does not sign, notarize, or publish a build.
# Required secrets are listed in docs/dra-signed-updates.md.
# Values are read from the CI environment only and are never written into the repository.
name: DRA update signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm signing secrets are present
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          DRA_SIGNING_PUBLISHER: ${{ secrets.DRA_SIGNING_PUBLISHER }}
        run: |
          set -euo pipefail
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD DRA_SIGNING_PUBLISHER; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: ${name}"
              missing=1
            else
              echo "Present: ${name}"
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "Signing skeleton stopped. No artifact was signed."
            exit 1
          fi
          echo "Signing secrets are present. No artifact was signed."
