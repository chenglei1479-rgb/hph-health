name: DRA preserved Mac package verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/dra-mac-verify.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: dra-mac-verify-033
  cancel-in-progress: false

jobs:
  mac:
    name: Verify preserved Mac ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            subdir: osx-arm64
            engine: darwin-arm64
          - arch: x64
            runner: macos-26-intel
            subdir: osx-64
            engine: darwin.dylib
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      NODE_OPTIONS: --max-old-space-size=8192
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d90f827c1a596915403cf188acaacb8b23e2061
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use lockfile-compatible npm
        run: npm install --global npm@10.9.8 --no-audit --no-fund
      - name: Install smoke harness dependencies
        run: node scripts/ci/npm-ci.mjs --install-links
      - uses: actions/download-artifact@v4
        with:
          name: dra-mac-candidate-${{ matrix.arch }}
          run-id: 38529669100
          github-token: ${{ github.token }}
          path: dist
      - name: Adapt verification harness to DRA branding
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const file = 'scripts/macos-package-smoke.mjs'
          const source = fs.readFileSync(file, 'utf8')
          const count = source.split('Deep Research Agent').length - 1
          if (count !== 3) throw new Error('Unexpected upstream smoke harness')
          fs.writeFileSync(file, source.replaceAll('Deep Research Agent', 'DRA'))
          const branded = fs.readFileSync(file, 'utf8')
          fs.writeFileSync(file, branded.replace(
            "OPEN_SCIENCE_E2E_NATIVE_SHELL_CERTIFICATION: '1'",
            "OPEN_SCIENCE_E2E_NATIVE_SHELL_CERTIFICATION: '1', DRA_AUTH_MODE: 'local', DRA_ACTIVE_PROFILE: 'local-mac-package-smoke'"
          ))
          const authFile = 'scripts/packaged-web-service-auth.mjs'
          const auth = fs.readFileSync(authFile, 'utf8')
          if (!auth.includes('(?:Deep Research Agent|MedResearch Agent) Web:')) throw new Error('Unexpected auth parser')
          fs.writeFileSync(authFile, auth.replace('(?:Deep Research Agent|MedResearch Agent) Web:', '(?:DRA|Deep Research Agent|MedResearch Agent) Web:'))
          NODE
      - name: Verify DMG and ZIP launches, native modules, migrations and reopen
        run: node scripts/macos-package-smoke.mjs --artifact-dir dist
      - name: Prepare downloads and auditable checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          for ext in dmg zip; do
            cp "dist/deep-research-agent-0.1.33-macpilot.2-mac-${{ matrix.arch }}.$ext" "deliverables/DRA-0.1.33-macpilot.2-mac-${{ matrix.arch }}.$ext"
          done
          cp dist/database-migration-certification.json 'deliverables/database-migration-mac-${{ matrix.arch }}.json'
          cd deliverables
          shasum -a 256 *.dmg *.zip > 'SHA256-mac-${{ matrix.arch }}.txt'
          printf '%s\n' 'source=0d90f827c1a596915403cf188acaacb8b23e2061' 'version=0.1.33-macpilot.2' 'arch=${{ matrix.arch }}' 'signing=ad-hoc' 'notarized=false' 'gatekeeperAccepted=false' 'packageSmoke=passed' 'accountMode=isolated-local-test' 'realAccountLoginAccepted=false' 'fullRegression=false' 'realDoctorAccepted=false' > 'verification-mac-${{ matrix.arch }}.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: dra-mac-verified-${{ matrix.arch }}
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish only after both Mac architectures pass
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dra-mac-verified-*
          path: deliverables
          merge-multiple: true
      - name: Verify release identity and upload without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v0.1.33-unified.1 --json isPrerelease --jq .isPrerelease)" = true
          cd deliverables
          shasum -a 256 -c SHA256-mac-arm64.txt
          shasum -a 256 -c SHA256-mac-x64.txt
          gh release upload v0.1.33-unified.1 ./*