name: PR unit tests

# #150: PR CI ran packaging, PHI, i18n, licence and egress checks but no unit tests at all, so
# `application-command-composition.test.ts` stayed 27/27 red in main for a day while every pull
# request was green, and the packaged app failed to start on all three platforms. The impact-based
# selector only ever existed behind the local `npm run test:affected`.
#
# The test targets below are fixed on purpose. Impact-based selection saves time, but its failure
# mode is "the selector matched nothing and the job still passed", which is exactly the shape of
# that incident. If this set becomes too slow, add groups to the matrix; do not reintroduce a
# selector without the readiness guard in `scripts/ci/require-unit-test-results.mjs`.
#
# `src/main/application-command-composition.test.ts` is the one single-file target: it is the
# incident suite, it cannot be isolated from a directory, and the guard fails the job when it is
# missing from the results. Renaming it is therefore a red build, not a silent no-op.
#
# `src/main/notebook` used to be left out: measured locally it was 181 files / 6536 tests / 63 failing,
# and those failures were environment-bound (real kernels, shell and REPL processes, the npm registry,
# packaged Electron) or stale expectations. It now runs as its own job so its failures are attributable
# and its ~7-minute cost does not push this job into its timeout. On this developer machine the job's
# set is 175 files / 6465 reported tests (2996 executed, 3469 skipped) in 398 s with two workers; the
# remaining local failures there are the sandbox's own (no symlink privilege, and a temporary root deep
# enough to overflow the Windows path limit), not code. The eight suites that need a live environment
# are excluded by name in `vitest.config.ts` (NOTEBOOK_PR_EXCLUDE_PATTERNS), each with its reason.
on:
  pull_request:
  # #208: a plain merge into main ran nothing, which is how #150's 27/27 red composition suite and
  # #207's packaging blocker survived in main while every pull request was green. These jobs carry the
  # incident suites; the commit main receives must be checked too, not only the commit that proposed
  # it. The concurrency group below falls back to `github.ref` off a pull request, so a main push never
  # cancels a pull-request run or the other way round.
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (commands, shared, i18n, diagnostics)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: node scripts/ci/npm-ci.mjs --install-links
      - name: Build workspace packages
        run: node scripts/build-dev-packages.mjs
      - name: Run the unit-test set
        run: >-
          node node_modules/vitest/vitest.mjs run
          src/main/application-command-composition.test.ts
          src/main/variable-definition
          src/shared
          src/renderer/src/i18n
          packages/diagnostics
          scripts/ci/require-unit-test-results.test.ts
          scripts/ci/main-push-guards.test.ts
          --reporter=json
          --outputFile="$env:RUNNER_TEMP/unit-results-commands.json"
          --reporter=default
          --maxWorkers=2
      # A run that matched nothing still exits 0, so the report itself is the evidence of work. One
      # sentinel per directory: a filter that stops matching (renamed file, moved directory) must red
      # the job instead of quietly shrinking the set. The sentinels are stable suites nobody plans to
      # delete; the readiness guard's own self-test is one of them so it can never go unrun again.
      - name: Require real test execution
        run: >-
          node scripts/ci/require-unit-test-results.mjs
          "$env:RUNNER_TEMP/unit-results-commands.json"
          --require src/main/application-command-composition.test.ts
          --require scripts/ci/require-unit-test-results.test.ts
          --require scripts/ci/main-push-guards.test.ts
          --require src/main/variable-definition/service.test.ts
          --require src/shared/acp.test.ts
          --require src/renderer/src/i18n/resources.test.ts
          --require packages/diagnostics/src/logger.test.ts

  # #179: the Notebook suites guard the PHI and output-path fixes that landed in one week (a corrupted
  # statistic, a refused aggregate age, two phone-rule layers, mojibake from a Python pipe). No job ran
  # them before, so a regression in any of those would have reached a beta unnoticed. A separate job
  # keeps its measured ~7 minutes off the job above and leaves a red result attributable to this
  # directory.
  unit-tests-notebook:
    name: Unit tests (notebook)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: node scripts/ci/npm-ci.mjs --install-links
      - name: Build workspace packages
        run: node scripts/build-dev-packages.mjs
      # The variable switches on NOTEBOOK_PR_EXCLUDE_PATTERNS: a written list of the suites that need a
      # real kernel, shell, REPL, npm registry, packaged Electron or symlink privilege. Without it the
      # whole directory runs, which is what a developer wants locally.
      # The JSON report feeds the guard; the default reporter is what makes a job log readable. With
      # only `--reporter=json` the log said "Process completed with exit code 1" and nothing else, so a
      # red run could not be attributed to a test without downloading an artifact that is not uploaded
      # (#179 red proof). Both reporters run: the file stays machine-readable, the log stays evidence.
      #
      # 60 s instead of the 15 s default. The first CI run of this job (127880034774) timed out eleven
      # tests in `local-rpc-server`, `runtime-service`, `python-command` and `input-registry` at exactly
      # 15000ms, each of which runs in well under a second on a developer machine; two workers on a
      # shared Windows runner is the difference, not the code. Recorded here so the next person reads
      # the measurement rather than guessing, and so a real hang is not mistaken for a slow runner.
      - name: Run the notebook unit-test set
        env:
          OPEN_SCIENCE_NOTEBOOK_PR_JOB: '1'
        run: >-
          node node_modules/vitest/vitest.mjs run
          src/main/notebook
          --reporter=json
          --outputFile="$env:RUNNER_TEMP/unit-results-notebook.json"
          --reporter=default
          --testTimeout=60000
          --maxWorkers=2
      # Two sentinels: the suite that guards the PHI fixes above, and the kernel protocol every notebook
      # execution goes through. Renaming or moving either one must red this job, not shrink the set.
      - name: Require real test execution
        run: >-
          node scripts/ci/require-unit-test-results.mjs
          "$env:RUNNER_TEMP/unit-results-notebook.json"
          --require src/main/notebook/schema-only/patient-phi.test.ts
          --require src/main/notebook/kernel-protocol.test.ts

  # #202: six PHI criteria changed in one release window (#159, #160, #170, #171, #175, #161) and every
  # acceptance run was local evidence: `src/main/phi` was in no PR job's vitest target, so a change to
  # what is treated as patient information could merge with a green PR. That is the #150 shape again.
  # A separate job keeps the red result attributable to this directory; the suite itself is cheap.
  #
  # Measured on this developer machine: 16 files, 320 reported tests, 319 executed, 1 skipped (the
  # real-Electron-window case, which probes window creation and prints a warning when it cannot run),
  # 7.5 s. The suite does not import a kernel, shell or registry, so nothing here depends on runner
  # timing the way the notebook set does.
  unit-tests-phi:
    name: Unit tests (phi)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: node scripts/ci/npm-ci.mjs --install-links
      - name: Build workspace packages
        run: node scripts/build-dev-packages.mjs
      # A directory, not a file: a new suite under src/main/phi is included by default, and a renamed one
      # has to be dealt with here rather than silently leaving the set (#179 rule). No
      # `--passWithNoTests`: a filter that matches nothing must fail, and the sentinels below make a
      # silently shrinking set red too.
      # #195: the failure-class suite lives under src/main/settings, which no PR job runs. It is named
      # explicitly instead of adding the whole directory: the rest of that directory has four
      # environment-dependent failures that pre-date this branch and would bury the result here.
      - name: Run the phi unit-test set
        run: >-
          node node_modules/vitest/vitest.mjs run
          src/main/phi
          src/main/settings/phi-failure-classes.test.ts
          --reporter=json
          --outputFile="$env:RUNNER_TEMP/unit-results-phi.json"
          --reporter=default
          --maxWorkers=2
      # Two sentinels for the two layers: detect.test.ts guards what counts as PHI, gate.test.ts guards
      # whether a turn is blocked, reviewed or released. Renaming or moving either one must red this job.
      - name: Require real test execution
        run: >-
          node scripts/ci/require-unit-test-results.mjs
          "$env:RUNNER_TEMP/unit-results-phi.json"
          --require src/main/phi/detect.test.ts
          --require src/main/phi/gate.test.ts
          --require src/main/settings/phi-failure-classes.test.ts

  # #192: `build/` holds the installer and packaging guards - the placeholder-brackets release check, the
  # NSIS path budget, the three-language installer strings and `packaging.test.ts`, whose `-WX`
  # preflight-order case is the one written for #205. No pull request ran any of it, which is why #206
  # could sit in main for two days: the probes were green locally and the packaging job was not part of
  # the merge decision. A separate job keeps a red result attributable to the packaging input instead of
  # hiding it among 3000 other assertions.
  #
  # Three targets, all deliberate:
  #   - `build/` WITH the trailing slash. The positional arguments are substring filters, not paths:
  #     `build` alone also matches `scripts/electron-builder-config.test.ts` (the word "builder"),
  #     `scripts/build-backend.integration.test.ts` and `scripts/dev-build-watch.integration.test.ts`,
  #     which need a full build pipeline and a watcher. The slash is load-bearing.
  #   - `scripts/electron-builder-config.test.ts` as a file, because the electron-builder config guard
  #     lives outside `build/`. Leaving it out would leave every change to `electron-builder.yml`
  #     unguarded - the same gap this ticket is about. It is named, not globbed, and the guard below
  #     fails if it stops running.
  #   - `scripts/credential-helper-signing.test.ts` (#213), because it guards `afterSign:
  #     build/sign-windows.cjs` - every unsigned bundled Windows PE is signed exactly once and pinned
  #     vendor signatures are preserved. That is a packaging input, which puts it under the #206 rule:
  #     a change to the signing hook is not signed off until a job has exercised it. It sat red and
  #     outside every job since the afterPack hook was renamed to `deployment-pack.cjs`, because its
  #     sandbox resolved a sibling id against the test file. Fixed, then added here - in that order,
  #     not the reverse.
  #
  # A fresh runner has no electron-builder NSIS cache, and the NSIS cases skip themselves without one.
  # `scripts/ci/prepare-nsis-toolchain.mjs` downloads the exact toolchain electron-builder compiles with
  # and fails the job when it cannot, so this job compiles instead of reporting skips. Measured on this
  # developer machine from an empty cache: download 28.7 s, suite 11.3 s, 6 files / 109 tests / 0 skipped.
  unit-tests-build:
    name: Unit tests (build)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: node scripts/ci/npm-ci.mjs --install-links
      - name: Build workspace packages
        run: node scripts/build-dev-packages.mjs
      # Fail closed: without the toolchain the NSIS cases skip, and a skipped release-blocker guard is
      # how #205 shipped. This step is the reason the suite has no skips here.
      - name: Prepare the NSIS toolchain the packaging tests compile with
        run: node scripts/ci/prepare-nsis-toolchain.mjs
      - name: Run the packaging unit-test set
        run: >-
          node node_modules/vitest/vitest.mjs run
          build/
          scripts/electron-builder-config.test.ts
          scripts/credential-helper-signing.test.ts
          scripts/deb-cli-launcher.test.ts
          --reporter=json
          --outputFile="$env:RUNNER_TEMP/unit-results-build.json"
          --reporter=default
          --maxWorkers=2
      # Sentinels for the two inputs this job exists to protect: the installer script itself and the
      # electron-builder configuration that decides what gets packaged.
      #
      # `--no-skips` is the second gate, and it is only here. `--require` proves a file ran with at
      # least one executed assertion; it does not prove the case that matters inside that file ran.
      # Without it this job goes green when `prepare-nsis-toolchain.mjs` succeeds but
      # `packaging.test.ts`'s own lookup disagrees with it and the `-WX` ordering case skips itself -
      # which is the #205 shape exactly: the probe exists, the guarded thing never ran, the job is
      # green. Measured here: 0 skipped with the toolchain prepared, so any skip is a real finding.
      # The PHI job keeps its one legitimate skip (a real Electron window that cannot be created
      # everywhere), which is why this is a flag and not the default.
      - name: Require real test execution
        run: >-
          node scripts/ci/require-unit-test-results.mjs
          "$env:RUNNER_TEMP/unit-results-build.json"
          --require build/packaging.test.ts
          --require build/installer-localization.test.ts
          --require build/assert-placeholder-brackets.test.ts
          --require scripts/electron-builder-config.test.ts
          --require scripts/credential-helper-signing.test.ts
          --require scripts/deb-cli-launcher.test.ts
          --no-skips

  # #213: the `scripts/ci` guards assert on real repository state - the workflow files, the module-impact
  # manifests, the change-impact selectors - and none of them ran in any job, so 111 assertions across
  # 20 files rotted unnoticed. This runs the directory, never a file list: a new guard is included by
  # default and a renamed one has to be dealt with here (#179).
  #
  # `npm run test:scripts`, not `node node_modules/vitest/...`: on Windows the module-impact executor
  # refuses to run without `npm_execpath` (`module-test-impact.mjs:385`), and npm sets it for us. Running
  # vitest directly is exactly the "green locally, red on CI" shape this ticket exists to remove.
  #
  # `--allow-skip` instead of `--no-skips`: this directory has legitimate platform skips (the POSIX
  # publication harness, the packaged macOS app). Every skip is printed, a skip that no allowance names
  # fails, and an allowance that stops matching is printed as `UNUSED SKIP ALLOWANCE` without failing.
  # Measured on this developer machine: 53 files, 1774 tests, 189 s with two workers.
  unit-tests-scripts:
    name: Unit tests (scripts)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: node scripts/ci/npm-ci.mjs --install-links
      - name: Build workspace packages
        run: node scripts/build-dev-packages.mjs
      - name: Run the script guard set
        run: >-
          npm run test:scripts --
          --reporter=json
          --outputFile="$env:RUNNER_TEMP/unit-results-scripts.json"
          --reporter=default
          --maxWorkers=2
      - name: Require real test execution
        run: >-
          node scripts/ci/require-unit-test-results.mjs
          "$env:RUNNER_TEMP/unit-results-scripts.json"
          --require scripts/ci/audit-module-ownership.test.ts
          --require scripts/ci/validate-module-impact.test.ts
          --require scripts/ci/module-consumer-coverage.test.ts
          --require scripts/ci/package-boundaries.test.ts
          --allow-skip scripts/ci/scripts-job-skip-allowances.json
