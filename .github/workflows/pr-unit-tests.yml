name: PR unit tests

# #150: PR CI ran packaging, PHI, i18n, licence and egress checks but no unit tests at all, so
# `application-command-composition.test.ts` stayed 27/27 red in main for a day while every pull
# request was green, and the packaged app failed to start on all three platforms. The impact-based
# selector only ever existed behind the local `npm run test:affected`.
#
# The test targets below are fixed on purpose. Impact-based selection saves time, but its failure
# mode is "the selector matched nothing and the job still passed", which is exactly the shape of
# that incident. If this set becomes too slow, add groups to the matrix; do not reintroduce a
# selector without the readiness guard in `scripts/ci/require-unit-test-results.mjs`.
#
# `src/main/application-command-composition.test.ts` is the one single-file target: it is the
# incident suite, it cannot be isolated from a directory, and the guard fails the job when it is
# missing from the results. Renaming it is therefore a red build, not a silent no-op.
#
# `src/main/notebook` used to be left out: measured locally it was 181 files / 6536 tests / 63 failing,
# and those failures were environment-bound (real kernels, shell and REPL processes, the npm registry,
# packaged Electron) or stale expectations. It now runs as its own job so its failures are attributable
# and its 10-minute cost does not push this job into its timeout. The environment-bound suites are
# excluded by name in `vitest.config.ts` (NOTEBOOK_PR_EXCLUDE_PATTERNS) and each is listed with its
# reason there; everything else in the directory runs.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (commands, shared, i18n, diagnostics)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: node scripts/ci/npm-ci.mjs --install-links
      - name: Build workspace packages
        run: node scripts/build-dev-packages.mjs
      - name: Run the unit-test set
        run: >-
          node node_modules/vitest/vitest.mjs run
          src/main/application-command-composition.test.ts
          src/main/variable-definition
          src/shared
          src/renderer/src/i18n
          packages/diagnostics
          scripts/ci/require-unit-test-results.test.ts
          --reporter=json
          --outputFile="$env:RUNNER_TEMP/unit-results-commands.json"
          --maxWorkers=2
      # A run that matched nothing still exits 0, so the report itself is the evidence of work. One
      # sentinel per directory: a filter that stops matching (renamed file, moved directory) must red
      # the job instead of quietly shrinking the set. The sentinels are stable suites nobody plans to
      # delete; the readiness guard's own self-test is one of them so it can never go unrun again.
      - name: Require real test execution
        run: >-
          node scripts/ci/require-unit-test-results.mjs
          "$env:RUNNER_TEMP/unit-results-commands.json"
          --require src/main/application-command-composition.test.ts
          --require scripts/ci/require-unit-test-results.test.ts
          --require src/main/variable-definition/service.test.ts
          --require src/shared/acp.test.ts
          --require src/renderer/src/i18n/resources.test.ts
          --require packages/diagnostics/src/logger.test.ts

  # #179: the Notebook suites guard the PHI and output-path fixes that landed in one week (a corrupted
  # statistic, a refused aggregate age, two phone-rule layers, mojibake from a Python pipe). No job ran
  # them before, so a regression in any of those would have reached a beta unnoticed. A separate job
  # keeps its ~10 minutes off the job above and leaves a red result attributable to this directory.
  unit-tests-notebook:
    name: Unit tests (notebook)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: node scripts/ci/npm-ci.mjs --install-links
      - name: Build workspace packages
        run: node scripts/build-dev-packages.mjs
      # The variable switches on NOTEBOOK_PR_EXCLUDE_PATTERNS: a written list of the suites that need a
      # real kernel, shell, REPL, npm registry, packaged Electron or symlink privilege. Without it the
      # whole directory runs, which is what a developer wants locally.
      - name: Run the notebook unit-test set
        env:
          OPEN_SCIENCE_NOTEBOOK_PR_JOB: '1'
        run: >-
          node node_modules/vitest/vitest.mjs run
          src/main/notebook
          --reporter=json
          --outputFile="$env:RUNNER_TEMP/unit-results-notebook.json"
          --maxWorkers=2
      # Two sentinels: the suite that guards the PHI fixes above, and the kernel protocol every notebook
      # execution goes through. Renaming or moving either one must red this job, not shrink the set.
      - name: Require real test execution
        run: >-
          node scripts/ci/require-unit-test-results.mjs
          "$env:RUNNER_TEMP/unit-results-notebook.json"
          --require src/main/notebook/schema-only/patient-phi.test.ts
          --require src/main/notebook/kernel-protocol.test.ts
