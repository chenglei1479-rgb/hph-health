name: i18n guard

# Deliberately not path-filtered. Translation copy moves between `src/shared/i18n` and
# `src/main/locale`, and a rebase can move a key between the `renderer` and `native`
# namespaces, so a path filter would skip exactly the revisions this guard exists to catch.
# The suite is 786 catalog assertions in pure JS and finishes in seconds.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogs:
    name: i18n catalog guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # The test itself resolves only npm dependencies, but vitest loads the shared setup
      # files, and `test/setup-phi.ts` imports `src/main/phi/gate`, which imports
      # `@aipoch/diagnostics/node`. `npm install --ignore-scripts` does not build workspace
      # packages, so that one import has to be built before the suite can load.
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build the workspace package the phi setup imports
        run: npm run build:diagnostics
      - name: Run the locale catalog guard
        run: node node_modules/vitest/vitest.mjs run src/renderer/src/i18n/resources.test.ts
