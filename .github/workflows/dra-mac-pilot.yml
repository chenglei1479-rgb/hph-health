name: DRA Mac pilot build and verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/dra-mac-pilot.yml]

permissions:
  contents: read

concurrency:
  group: dra-mac-pilot-033
  cancel-in-progress: false

jobs:
  mac:
    name: Build and verify Mac ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            subdir: osx-arm64
            engine: darwin-arm64
          - arch: x64
            runner: macos-26-intel
            subdir: osx-64
            engine: darwin.dylib
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      NODE_OPTIONS: --max-old-space-size=8192
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67d17d57ff56b6f48aa0a3231e8000903797b282
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify source identity and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 67d17d57ff56b6f48aa0a3231e8000903797b282
          test "$(node -p 'process.platform')" = darwin
          test "$(node -p 'process.arch')" = '${{ matrix.arch }}'
          test "$(node -p 'require("./package.json").version')" = 0.1.33-unified.1
          actool --version
      - name: Use lockfile-compatible npm
        run: npm install --global npm@10.9.8 --no-audit --no-fund
      - name: Install native dependencies
        run: node scripts/ci/npm-ci.mjs --install-links
      - name: Typecheck
        run: npm run typecheck
      - name: Verify Home logo and three-line DRA brand
        run: npx vitest run src/renderer/src/pages/home/HomePage.render.test.tsx -t 'keeps the logo and three-line DRA signature in the home header'
      - name: Adapt upstream storage test fixtures to DRA identities
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const file = 'src/main/storage/brand-location.test.ts'
          let source = fs.readFileSync(file, 'utf8')
          source = source.replaceAll('MedResearch Agent', 'MedResearch-Agent')
            .replaceAll('OpenScience-dev', 'MedResearchAgent-DEV')
            .replaceAll('OpenScience', 'MedResearchAgent')
            .replaceAll('.open-science', '.medresearch-agent')
            .replace("const expected = join(configRoot, packaged ? 'MedResearchAgent' : 'MedResearchAgent-DEV')", "const expected = join(configRoot, packaged ? 'OpenScience' : 'OpenScience-DEV')")
            .replace('keeps a populated lowercase development root created by 0.31', 'keeps a populated former DRA development root')
          fs.writeFileSync(file, source)
          const rootFile = 'src/main/storage-root.test.ts'
          source = fs.readFileSync(rootFile, 'utf8')
            .replaceAll("'/mnt/data/open-science'", "'/mnt/data/medresearch-agent'")
            .replaceAll("'/mnt/data/OPENSCIENCE'", "'/mnt/data/MEDRESEARCH-AGENT'")
            .replace("p('data', 'open-science')", "p('data', 'medresearch-agent')")
          fs.writeFileSync(rootFile, source)
          NODE
      - name: Verify translations and native storage upgrades
        run: >-
          npx vitest run src/renderer/src/i18n/resources.test.ts
          src/main/storage-root.test.ts src/main/storage/brand-location.test.ts
          src/main/storage/data-location-identity.test.ts
          src/main/settings/document-store.test.ts src/main/settings/repository.test.ts
          --maxWorkers=1 --testTimeout=30000 --hookTimeout=30000
      - name: Stage pinned micromamba and prune foreign Prisma engines
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fetch-micromamba.mjs '${{ matrix.subdir }}' 'resources/bin/mac/${{ matrix.arch }}/micromamba'
          'resources/bin/mac/${{ matrix.arch }}/micromamba' --version
          found=0
          for f in node_modules/.prisma/client/*query_engine-*; do
            [ -e "$f" ] || continue
            case "$f" in
              *'${{ matrix.engine }}'*) found=1 ;;
              *) rm -f "$f" ;;
            esac
          done
          test "$found" = 1
      - name: Verify on-demand notebook runtime availability
        run: node scripts/verify-runtime-bundle.mjs '${{ matrix.subdir }}'
      - name: Build desktop and web renderer
        run: |
          npm run build:e2e
          npm run build:web
      - name: Ensure native credential helpers are physically packaged
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import yaml from 'js-yaml'
          import { createRequire } from 'node:module'
          const require = createRequire(import.meta.url)
          const native = require('@aipoch/credential-identity-probe-native')
          for (const helper of [native.executablePath, native.validatorExecutablePath]) {
            if (!fs.existsSync(helper)) throw new Error('Native credential helper missing before packaging: '+helper)
          }
          const config = yaml.load(fs.readFileSync('electron-builder.yml', 'utf8'))
          for (const name of ['credential_identity_probe', 'credential_key_validator']) {
            config.mac.extraResources.push({
              from: 'node_modules/@aipoch/credential-identity-probe-native/build/Release/'+name,
              to: 'app.asar.unpacked/node_modules/@aipoch/credential-identity-probe-native/build/Release/'+name
            })
          }
          config.extraMetadata = {version:'0.1.33-macpilot.1'}
          config.dmg.sign = false
          config.mac.notarize = false
          config.electronDownload.mirror = 'https://github.com/electron/electron/releases/download/'
          fs.writeFileSync('dra-mac-pilot.config.json', JSON.stringify(config,null,2))
          NODE
      - name: Package ad-hoc signed research pilot
        run: npx electron-builder --config dra-mac-pilot.config.json --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Preserve built candidate for independent verification retries
        uses: actions/upload-artifact@v4
        with:
          name: dra-mac-candidate-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Diagnose actual packaged credential helpers
        shell: bash
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 2 -type d -name DRA.app | head -n 1)
          test -n "$app"
          helper="$app/Contents/Resources/app.asar.unpacked/node_modules/@aipoch/credential-identity-probe-native/build/Release/credential_identity_probe"
          test -x "$helper"
          file "$helper"
          codesign --verify --strict "$helper"
          "$helper" 'MedResearch Agent'
      - name: Adapt verification harness to DRA branding
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const file = 'scripts/macos-package-smoke.mjs'
          const source = fs.readFileSync(file, 'utf8')
          const count = source.split('Deep Research Agent').length - 1
          if (count !== 3) throw new Error('Unexpected upstream smoke harness')
          fs.writeFileSync(file, source.replaceAll('Deep Research Agent', 'DRA'))
          NODE
      - name: Verify DMG and ZIP launches, native modules, migrations and reopen
        run: node scripts/macos-package-smoke.mjs --artifact-dir dist
      - name: Prepare downloads and auditable checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          for ext in dmg zip; do
            cp "dist/deep-research-agent-0.1.33-macpilot.1-mac-${{ matrix.arch }}.$ext" "deliverables/DRA-0.1.33-macpilot.1-mac-${{ matrix.arch }}.$ext"
          done
          cp dist/database-migration-certification.json 'deliverables/database-migration-mac-${{ matrix.arch }}.json'
          cd deliverables
          shasum -a 256 *.dmg *.zip > 'SHA256-mac-${{ matrix.arch }}.txt'
          printf '%s\n' 'source=67d17d57ff56b6f48aa0a3231e8000903797b282' 'version=0.1.33-macpilot.1' 'arch=${{ matrix.arch }}' 'signing=ad-hoc' 'notarized=false' 'gatekeeperAccepted=false' 'packageSmoke=passed' 'fullRegression=false' 'realDoctorAccepted=false' > 'verification-mac-${{ matrix.arch }}.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: dra-mac-${{ matrix.arch }}
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish only after both Mac architectures pass
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dra-mac-*
          path: deliverables
          merge-multiple: true
      - name: Verify release identity and upload without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v0.1.33-unified.1 --json isPrerelease --jq .isPrerelease)" = true
          cd deliverables
          shasum -a 256 -c SHA256-mac-arm64.txt
          shasum -a 256 -c SHA256-mac-x64.txt
          gh release upload v0.1.33-unified.1 ./*

