name: Unsigned internal beta

# Tag pushes such as v0.1.33-beta.1, a manual run with the same tag shape, or a pull request.
# Packages are unsigned. macOS keeps the existing ad-hoc signature so Gatekeeper does not
# report a damaged bundle; there is no Developer ID signature and no notarization.
# Pull requests run the same package and launch smoke, and do not publish.
on:
  pull_request:
  push:
    tags:
      - 'v*-beta*'
  workflow_dispatch:
    inputs:
      tag:
        description: Prerelease tag to publish, for example v0.1.33-beta.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Unsigned ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64 dmg
            platform: mac
            target: dmg
            arch: arm64
          # Build x64 on Intel macOS 26. An arm64 host compiles the credential probe
          # for arm64, and that Mach-O makes the packaged Intel app stop at startup.
          # macos-15-intel only has actool 16.4, which cannot compile the icon asset.
          - os: macos-26-intel
            label: macOS x64 dmg
            platform: mac
            target: dmg
            arch: x64
          - os: windows-latest
            label: Windows x64 NSIS
            platform: win
            target: nsis
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DRA_PRERELEASE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Refuse a signing certificate
        shell: bash
        run: |
          if [ -n "${CSC_LINK:-}" ] || [ -n "${WIN_CSC_LINK:-}" ] || [ -n "${CSC_KEY_PASSWORD:-}" ] || [ -n "${WIN_CSC_KEY_PASSWORD:-}" ] || [ -n "${DRA_SIGNING_PUBLISHER:-}" ]; then
            echo "Prerelease builds must not use a signing certificate." >&2
            exit 1
          fi

      - name: Install dependencies
        # package-lock.json packs the file: native packages. npm ci only
        # accepts that lockfile when it is given the same --install-links flag.
        shell: bash
        run: node scripts/ci/npm-ci.mjs --install-links

      - name: Set the beta version from the tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Pull request smoke keeps the package.json version and does not publish."
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          case "$TAG" in
            v*-beta*) ;;
            *)
              echo "Tag must match v*-beta* (for example v0.1.33-beta.1)." >&2
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "DRA_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build the app
        shell: bash
        # macos-latest is a 7 GB arm64 runner. electron-vite aborts at Node's
        # default ~2 GB heap (exit 134). Same NODE_OPTIONS mechanism as the
        # DRA Mac pilot workflow, sized to fit this runner.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm run build:web
          npx electron-vite build

      - name: Bundle the offline schema-notebook Python
        shell: bash
        env:
          SCHEMA_NOTEBOOK_PLATFORM: ${{ matrix.platform }}
          SCHEMA_NOTEBOOK_ARCH: ${{ matrix.arch }}
        run: node scripts/stage-schema-notebook-python.mjs

      - name: Package unsigned installers
        shell: bash
        # Same 6 GB ceiling as the app build. macos-latest has 7 GB of RAM;
        # 8192 does not leave room for the OS beside Node. The Python prefix
        # is copied from disk and is not loaded into this heap.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx electron-builder --config build/prerelease-electron-builder.cjs --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }}

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dra-${{ matrix.arch }}-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error

  smoke:
    name: Launch smoke ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: dra-x64-win
          # macos-14 is the Apple silicon image requested for this smoke. It retires on
          # 2026-11-02; until then it is the arm64 runner that matches the beta dmg.
          - os: macos-14
            label: macOS arm64
            artifact: dra-arm64-mac
          # macos-13, the previous free Intel image, was removed in December 2025.
          # macos-15-intel is the GitHub-hosted x64 runner that replaced it.
          - os: macos-15-intel
            label: macOS x64
            artifact: dra-x64-mac
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Download the installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: packaged

      - name: Launch the packaged app and wait for home
        shell: bash
        env:
          SMOKE_PLATFORM_LABEL: ${{ matrix.label }}
        run: node scripts/ci/packaged-startup-smoke.mjs --artifact-dir packaged --timeout-ms 240000

      - name: Upload the startup log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: startup-log-${{ matrix.artifact }}
          path: startup-logs/**
          if-no-files-found: warn

  release:
    name: Publish prerelease
    needs: [build, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          case "$TAG" in
            v*-beta*) ;;
            *)
              echo "Tag must match v*-beta*." >&2
              exit 1
              ;;
          esac
          shopt -s globstar nullglob
          files=(dist/**/*.dmg dist/**/*-setup.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers to publish." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --prerelease --notes-file build/prerelease-release-notes.md
          else
            gh release create "$TAG" "${files[@]}" --prerelease --title "$TAG" --notes-file build/prerelease-release-notes.md
          fi
